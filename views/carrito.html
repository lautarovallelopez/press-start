</head>
<body>
  <div class="carrito-container">
    <h1>🛒 Mi Carrito</h1>
    <div id="lista-carrito"></div>
    <div class="total" id="total-carrito">Total: $ 0.00</div>

    <div id="estado-validacion" role="status" aria-live="polite"></div>
    <div id="problemas-stock" aria-live="polite"></div>

    <div class="finalizar">
      <a href="#" id="finalizar-compra" class="boton">✅ Finalizar compra por WhatsApp</a>
    </div>
  </div>

  <div class="volver-inicio">
    <a href="./index.html">🏠 Volver al inicio</a>
  </div>

  <script type="module">
    import {
  actualizarCarritoUI,
  obtenerStock
} from '../js/carrito-utils.js?v=3';
    import { whatsappLink } from '../js/config.js';
    import { fetchRoute } from '../js/api-client.js?v=7';

    const contenedor = document.getElementById('lista-carrito');
    const totalSpan = document.getElementById('total-carrito');


const PEDIDO_PENDIENTE_KEY = 'daleStartPedidoPendiente';

let validandoPedido = false;

function obtenerPedidoId(cart) {
  const productos = agruparCarrito(cart)
    .map(item => ({
      id: String(item.id).trim(),
      cantidad: item.cantidad
    }))
    .sort((a, b) => a.id.localeCompare(b.id));

  const firma = JSON.stringify(productos);

  const guardado = JSON.parse(
    localStorage.getItem(PEDIDO_PENDIENTE_KEY) || 'null'
  );

  if (guardado && guardado.firma === firma) {
    return guardado.pedidoId;
  }

  const pedidoId = crypto.randomUUID();

  localStorage.setItem(
    PEDIDO_PENDIENTE_KEY,
    JSON.stringify({ pedidoId, firma })
  );

  return pedidoId;
}

function invalidarPedidoPendiente() {
  localStorage.removeItem(PEDIDO_PENDIENTE_KEY);
}

function mostrarEstadoValidacion(mensaje, tipo = 'info') {
  const cont = document.getElementById('estado-validacion');

  cont.textContent = mensaje;
  cont.className = `estado-validacion ${tipo}`;
}

function limpiarEstadoValidacion() {
  const cont = document.getElementById('estado-validacion');

  cont.textContent = '';
  cont.className = '';
}


function mostrarProblemasStock(problemas) {
  const cont = document.getElementById('problemas-stock');
  cont.innerHTML = '';

  const titulo = document.createElement('h3');
  titulo.textContent = '⚠️ Hay productos que necesitan revisión';

  const descripcion = document.createElement('p');
  descripcion.textContent =
    'Corregí las cantidades para poder continuar con tu compra.';

  cont.append(titulo, descripcion);

  const carrito = JSON.parse(
    localStorage.getItem('carritoMardant') || '[]'
  );

  for (const problema of problemas) {
    const id = String(problema.id);

    const producto = carrito.find(
      p => String(p.id).trim() === id
    );

    const fila = document.createElement('div');
    fila.className = 'problema-stock-item';

    const nombre = document.createElement('strong');
    nombre.textContent = producto?.nombre || `Producto ID ${id}`;

    const detalle = document.createElement('p');

    const disponible = problema.disponible;

    detalle.textContent = disponible === null
      ? 'No pudimos verificar la disponibilidad.'
      : `Solicitaste ${problema.solicitado}. Disponibles: ${disponible}.`;

    fila.append(nombre, detalle);

    function actualizarCarrito(cantidadNueva) {
      const actual = JSON.parse(
        localStorage.getItem('carritoMardant') || '[]'
      );

      const iguales = actual.filter(
        p => String(p.id).trim() === id
      );

      const otros = actual.filter(
        p => String(p.id).trim() !== id
      );

      const ajustados = iguales
        .slice(0, cantidadNueva)
        .map(p => ({
          ...p,
          stock: disponible
        }));

      localStorage.setItem(
        'carritoMardant',
        JSON.stringify([...otros, ...ajustados])
      );

      invalidarPedidoPendiente();
      limpiarEstadoValidacion();
      cont.innerHTML = '';

      renderCarrito();
      actualizarCarritoUI();
    }

    if (Number.isInteger(disponible) && disponible > 0) {
      const ajustar = document.createElement('button');
      ajustar.type = 'button';
      ajustar.textContent = `Ajustar a ${disponible}`;

      ajustar.onclick = () => {
        actualizarCarrito(disponible);
      };

      fila.appendChild(ajustar);
    }

    const eliminar = document.createElement('button');
    eliminar.type = 'button';
    eliminar.textContent = 'Eliminar producto';

    eliminar.onclick = () => {
      actualizarCarrito(0);
    };

    fila.appendChild(eliminar);
    cont.appendChild(fila);
  }
}



    function waCleanText(str){
      // Quita caracteres invisibles/problemáticos
      str = String(str || '')
        .replace(/\u00A0/g, ' ')   // NBSP
        .replace(/\u200B/g, '')    // zero-width space
        .replace(/\uFEFF/g, '')    // BOM
        .replace(/\r\n/g, '\n');

      // Quita símbolos/emojis que terminan como caracteres raros en algunos WhatsApp
      // (mantiene español: tildes, ñ, ¿?, etc.)
      str = str.replace(/[^\x09\x0A\x0D\x20-\x7E\u00A1-\u00FF]/g, '');

      // Limpia espacios extra
      str = str.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');

      return str.trim();
    }

    function escapeHtml(str){
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const DESCUENTO = 0.15;
    const MINIMO_PRODUCTOS = 3;

    function calcularPrecio(precio, cantidad) {
      const original = Number(precio) || 0;
      return cantidad >= MINIMO_PRODUCTOS
        ? original * (1 - DESCUENTO)
        : original;
    }


function agruparCarrito(items) {
  const grupos = new Map();

  items.forEach(item => {
    const id = String(item.id ?? '').trim();
    const key = id
      ? `id:${id}`
      : `nombre:${item.nombre}`;

    if (!grupos.has(key)) {
      grupos.set(key, {
        ...item,
        key,
        cantidad: 0
      });
    }

    grupos.get(key).cantidad++;
  });

  return [...grupos.values()];
}


async function validarPedidoStock(pedidoId, cart) {
  const grupos = agruparCarrito(cart);

  if (!grupos.length) {
    throw new Error('El carrito está vacío.');
  }

  const productos = grupos.map(item => ({
    id: String(item.id ?? '').trim(),
    cantidad: item.cantidad
  }));

  if (productos.some(p => !p.id)) {
    throw new Error(
      'Hay productos sin ID. Volvé a agregarlos desde el catálogo.'
    );
  }

  const respuesta = await fetchRoute(
    'validarStockCarrito',
    {
      pedidoId,
      productos
    },
    {
      timeoutMs: 15000
    }
  );

  if (!respuesta || respuesta.ok !== true) {
    throw new Error(
      respuesta?.error || 'No se pudo validar el pedido.'
    );
  }

  if (
    typeof respuesta.stockSuficiente !== 'boolean' ||
    !Array.isArray(respuesta.problemas)
  ) {
    throw new Error('Respuesta inválida de Apps Script.');
  }

  return respuesta;
}



function renderCarrito() {
  const carritoLocal = JSON.parse(
    localStorage.getItem('carritoMardant') || '[]'
  );

  const grupos = agruparCarrito(carritoLocal);

  const cantidadTotal = carritoLocal.length;
  const tieneDescuento = cantidadTotal >= MINIMO_PRODUCTOS;

  const totalOriginal = carritoLocal.reduce(
    (sum, item) => sum + Number(item.precio || 0),
    0
  );

  const totalFinal = calcularPrecio(totalOriginal, cantidadTotal);

  contenedor.innerHTML = '';

  if (!grupos.length) {
    contenedor.innerHTML = `
      <div class="carrito-vacio">
        <h2>Tu carrito está vacío</h2>
        <p>¡Explorá nuestros productos y elegí tus favoritos!</p>
        <a href="./catalogo.html" class="boton">
          Explorar catálogo
        </a>
      </div>
    `;

    totalSpan.textContent = 'Total: $ 0.00';
    document.getElementById('finalizar-compra').hidden = true;
    return;
  }

  document.getElementById('finalizar-compra').hidden = false;

  grupos.forEach(item => {
    const precioOriginal = Number(item.precio) || 0;
    const precioFinal = calcularPrecio(
      precioOriginal,
      cantidadTotal
    );

    const subtotal = precioFinal * item.cantidad;

const stockMaximo = obtenerStock(item);

const limiteAlcanzado =
  stockMaximo === null ||
  item.cantidad >= stockMaximo;


    const div = document.createElement('div');
    div.className = 'carrito-item';

    div.innerHTML = `
      <img src="${escapeHtml(item.imagen)}"
           alt="${escapeHtml(item.nombre)}"
           referrerpolicy="no-referrer">

      <div class="carrito-info">
        <div class="nombre">${escapeHtml(item.nombre)}</div>

        <div class="precio">
          ${tieneDescuento ? `
            <del class="precio-original">
              $ ${precioOriginal.toFixed(2)}
            </del>
            <span class="precio-descuento">
              $ ${precioFinal.toFixed(2)}
            </span>
            <small class="etiqueta-descuento">15% OFF</small>
          ` : `
            $ ${precioOriginal.toFixed(2)}
          `}
        </div>

        <div class="cantidad-control">
          <button class="cantidad-menos"
                  type="button"
                  aria-label="Quitar una unidad"
                  ${validandoPedido ? 'disabled' : ''}>−</button>

          <span class="cantidad-numero">
            ${item.cantidad}
          </span>

          
<button class="cantidad-mas"
        type="button"
        aria-label="Agregar una unidad"
        ${limiteAlcanzado ? 'disabled' : ''}
        title="${limiteAlcanzado
          ? 'Stock máximo alcanzado'
          : 'Agregar una unidad'}"
          ${limiteAlcanzado || validandoPedido ? 'disabled' : ''}>
  +
</button>

        </div>

        <div class="carrito-subtotal">
          Subtotal: $ ${subtotal.toFixed(2)}
        </div>
      </div>
    `;

    div.querySelector('.cantidad-menos').addEventListener(
      'click',
      () => cambiarCantidad(item.key, -1)
    );

    div.querySelector('.cantidad-mas').addEventListener(
      'click',
      () => cambiarCantidad(item.key, 1)
    );

    contenedor.appendChild(div);




  });

  totalSpan.innerHTML = tieneDescuento
    ? `
      <div>
        <del class="precio-original">
          $ ${totalOriginal.toFixed(2)}
        </del>
      </div>
      <div>Total con 15% OFF: $ ${totalFinal.toFixed(2)}</div>
      <small>
        Ahorrás $ ${(totalOriginal - totalFinal).toFixed(2)}
      </small>
    `
    : `Total: $ ${totalOriginal.toFixed(2)}`;
}



function cambiarCantidad(key, cambio) {
  if (validandoPedido) return;
  const carritoLocal = JSON.parse(
    localStorage.getItem('carritoMardant') || '[]'
  );

  const obtenerKey = item => {
    const id = String(item.id ?? '').trim();
    return id
      ? `id:${id}`
      : `nombre:${item.nombre}`;
  };

  const index = carritoLocal.findIndex(
    item => obtenerKey(item) === key
  );

  if (index === -1) return;

  
if (cambio > 0) {
  const producto = carritoLocal[index];
  const stockMaximo = obtenerStock(producto);

  const cantidadActual = carritoLocal.filter(
    item => obtenerKey(item) === key
  ).length;

  if (stockMaximo === null ||
      cantidadActual >= stockMaximo) {
    return;
  }

  carritoLocal.push({ ...producto });
}
 else if (cambio < 0) {
    // Quitar solamente una unidad
    carritoLocal.splice(index, 1);
  }

  localStorage.setItem(
    'carritoMardant',
    JSON.stringify(carritoLocal)
  );

  renderCarrito();
  actualizarCarritoUI();
}


   

    document.getElementById('finalizar-compra').addEventListener('click', async (e) => {
      e.preventDefault();

      
if (validandoPedido) return;

const cart = JSON.parse(
  localStorage.getItem('carritoMardant') || '[]'
);

if (!cart.length) return;

const cantidad = cart.length;
const tieneDescuento = cantidad >= MINIMO_PRODUCTOS;

const boton = document.getElementById('finalizar-compra');
const pedidoId = obtenerPedidoId(cart);
const firmaInicial = JSON.stringify(
  agruparCarrito(cart)
    .map(item => ({
      id: String(item.id).trim(),
      cantidad: item.cantidad
    }))
    .sort((a, b) => a.id.localeCompare(b.id))
);

validandoPedido = true;
boton.classList.add('validando');
boton.textContent = '⏳ Verificando disponibilidad...';
renderCarrito();

document.getElementById('problemas-stock').innerHTML = '';

mostrarEstadoValidacion(
  'Estamos verificando el stock de tu pedido...',
  'info'
);

try {
  const respuesta = await validarPedidoStock(pedidoId, cart);

  if (!respuesta.stockSuficiente) {
    mostrarEstadoValidacion(
      'Algunos productos no tienen stock suficiente.',
      'error'
    );

    mostrarProblemasStock(respuesta.problemas);
    return;
  }

  const carritoActual = JSON.parse(
    localStorage.getItem('carritoMardant') || '[]'
  );

  const firmaActual = JSON.stringify(
    agruparCarrito(carritoActual)
      .map(item => ({
        id: String(item.id).trim(),
        cantidad: item.cantidad
      }))
      .sort((a, b) => a.id.localeCompare(b.id))
  );

  if (firmaActual !== firmaInicial) {
    mostrarEstadoValidacion(
      'El stock ya fue descontado, pero el carrito cambió durante la validación. Revisá tu pedido antes de continuar.',
      'error'
    );
    return;
  }

  mostrarEstadoValidacion(
    '¡Stock confirmado! Tu pedido está listo para WhatsApp.',
    'success'
  );

  // La validación fue exitosa.
  // Aquí continúa el código actual del mensaje de WhatsApp.


      // Agrupar por id (si existe) o por nombre
      const groups = new Map();
      for (const item of cart) {
        const key = (item.id && String(item.id).trim())
          ? `id:${String(item.id).trim()}`
          : `name:${item.nombre}`;

        const g = groups.get(key) || { ...item, qty: 0 };
        g.qty += 1;
        groups.set(key, g);
      }

      const origin = location.origin;
      const lines = [];
      let total = 0;

      let i = 1;
      const trackingItems = [];
      for (const g of groups.values()) {
        
        const unit = Number(g.precio) || 0;
        const precioFinal = calcularPrecio(unit, cantidad);
        const sub = precioFinal * g.qty;

        total += sub;

        trackingItems.push({
          item_id: g.id ? String(g.id).trim() : '',
          item_name: g.nombre || 'Producto Dale Start',
          item_category: 'catalogo',
          price: precioFinal,
          quantity: g.qty
        });

        lines.push(
          tieneDescuento
            ? `${i}) ${g.qty} x ${g.nombre}\n` +
              `   Antes: ~${unit.toFixed(2)}~ c/u\n` +
              `   Ahora: $ ${precioFinal.toFixed(2)} c/u (15% OFF)\n` +
              `   Subtotal: $ ${sub.toFixed(2)}`
            : `${i}) ${g.qty} x ${g.nombre} — $ ${unit.toFixed(2)} c/u — Subtotal: $ ${sub.toFixed(2)}`
        );


        // Link detalle solo si hay id
        if (g.id && String(g.id).trim()) {
          const link = `ID: ${encodeURIComponent(String(g.id).trim())}`;
          lines.push(`   ${link}`);
        }

        i++;
      }
      const totalOriginal = cart.reduce(
        (sum, item) => sum + (Number(item.precio) || 0), 0
      );

      const mensaje = [
        '¡Hola! Quiero hacer un pedido en Dale Start Store.',
        '',
        'Mi pedido:',
        ...lines,
        '',
        ...(tieneDescuento ? [
          `Total original: ~${totalOriginal.toFixed(2)}~`,
          'Descuento por 3 o más productos: 15%',
          `Ahorro: $ ${(totalOriginal - total).toFixed(2)}`
        ] : []),
        `TOTAL A PAGAR: $ ${total.toFixed(2)}`
      ].join('\n');

      const clean = waCleanText(mensaje);
      const wa = whatsappLink(clean);
      window.MardantTracking?.trackBeginCheckout?.({
        value: total,
        items: trackingItems
      });
      window.location.assign(wa);

} catch (error) {
  console.error('Error validando pedido:', error);

  mostrarEstadoValidacion(
    error.message ||
      'No pudimos comprobar el stock. Intentá nuevamente.',
    'error'
  );

} finally {
  validandoPedido = false;
  boton.classList.remove('validando');
  boton.textContent = '✅ Finalizar compra por WhatsApp';
  renderCarrito();
}


    });

    renderCarrito();
  </script>
